<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vize Sınav Programı</title>

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Vize Takvimi">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <style>
        :root {
            --bg: #000000;
            --card: #0a0a0a;
            --border: #1a1a1a;
            --accent: #ffffff;
            --secondary: #888888;
            --highlight: #121212;
            --verified-blue: #0095f6;
            /* MOR TEMA RENKLERİ */
            --purple-shimmer: linear-gradient(120deg, #ffffff 40%, #a855f7 50%, #ffffff 60%);
            --purple-glow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg); color: var(--accent);
            margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center;
            min-height: 100vh; -webkit-tap-highlight-color: transparent;
        }

        .container { width: 100%; max-width: 400px; padding-bottom: 80px; }

        header { padding: 30px 0; border-bottom: 1px solid var(--border); margin-bottom: 25px; text-align: center; }
        
        h1 { 
            font-size: 0.85rem; font-weight: 300; letter-spacing: 4px; margin: 0; 
            text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 12px;
        }

        /* GÜN BLOKLARI */
        .day-block { background: var(--card); border: 1px solid var(--border); border-radius: 16px; margin-bottom: 18px; overflow: hidden; }
        
        .day-header { 
            background: var(--highlight); padding: 14px 18px; font-size: 0.75rem; font-weight: 700; 
            letter-spacing: 1px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }

        .day-icon { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; }
        .day-icon svg { stroke: #a855f7; } /* İkonlar Mor */

        /* AKTİF GÜN PARLAMASI (MOR) */
        .active-day-shimmer {
            background: linear-gradient(-90deg, #ffffff 0%, #ffffff 35%, #a855f7 50%, #ffffff 65%, #ffffff 100%);
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text; 
            color: transparent; -webkit-text-fill-color: transparent;
            animation: reverseShimmer 6s linear infinite;
        }

        /* DERS SEANSLARI */
        .session { padding: 18px; border-bottom: 1px solid #141414; position: relative; }
        .session:last-child { border-bottom: none; }
        
        .time { font-size: 0.7rem; color: var(--secondary); font-family: 'Courier New', monospace; display: block; margin-bottom: 4px; }
        .name { font-size: 0.9rem; font-weight: 400; color: #efefef; }
        .alttan { color: #a855f7; font-weight: bold; font-size: 0.65rem; margin-left: 5px; text-transform: uppercase; }

        /* CANLI SINAV PARLAMASI (YEŞİL HUZME) */
        .time-now {
            font-weight: bold !important;
            background: linear-gradient(120deg, #ffffff 40%, #2ecc71 50%, #ffffff 60%);
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text; 
            color: transparent; -webkit-text-fill-color: transparent;
            animation: reverseShimmer 4s linear infinite;
        }

        /* BİTMİŞ SINAV (KIRMIZI HUZME) */
        .time-past {
            text-decoration: line-through; opacity: 0.5;
            background: linear-gradient(120deg, #ff4d4d 40%, #ff0000 50%, #ff4d4d 60%);
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text; 
            color: transparent; -webkit-text-fill-color: transparent;
            animation: reverseShimmer 5s linear infinite;
        }

        /* EN ALTTAKI MOR HUZMELI YAZI */
        .ghost-purple-shimmer {
            text-align: center; font-size: 0.65rem; font-weight: 600; letter-spacing: 3px;
            padding: 50px 20px; text-transform: uppercase;
            background: var(--purple-shimmer);
            background-size: 200% auto; -webkit-background-clip: text; background-clip: text; 
            color: transparent; -webkit-text-fill-color: transparent;
            animation: reverseShimmer 8s linear infinite;
        }

        /* IMZA BOLUMU */
        .footer-signature {
            position: fixed; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 6px;
            background: rgba(10, 10, 10, 0.85); padding: 10px 16px; border-radius: 50px;
            border: 1px solid var(--border); backdrop-filter: blur(15px); z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .shimmer-box { display: flex; align-items: center; gap: 8px; }
        .sig-name { font-size: 0.75rem; font-weight: 600; color: #fff; }
        .ig-icon { width: 16px; height: 16px; fill: #fff; }
        .v-icon { fill: var(--verified-blue); width: 14px; height: 14px; }

        @keyframes reverseShimmer {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        @keyframes ring {
            0%, 20%, 100% { transform: rotate(0); }
            5% { transform: rotate(15deg); }
            10% { transform: rotate(-15deg); }
        }
        .active-ring svg { animation: ring 4s ease-in-out infinite; }
    </style>
</head>
<body>

<script>
    function updateLogic() {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const todayKey = `${year}${month}${day}`;
        const currentMins = now.getHours() * 60 + now.getMinutes();

        document.querySelectorAll('.time, .name').forEach(el => el.classList.remove('time-now', 'time-past'));
        document.querySelectorAll('.day-header').forEach(el => el.classList.remove('active-day-shimmer'));

        const todayBlock = document.getElementById('day-' + todayKey);
        if (todayBlock) {
            todayBlock.querySelector('.day-header').classList.add('active-day-shimmer');
            todayBlock.querySelector('.day-icon').classList.add('active-ring');
        }

        document.querySelectorAll('.session').forEach(s => {
            const sDate = s.getAttribute('data-date').replace(/-/g, '');
            const [h, m] = s.getAttribute('data-start').split(':');
            const startTotal = parseInt(h) * 60 + parseInt(m);
            const endTotal = startTotal + 60;

            const tEl = s.querySelector('.time');
            const nEl = s.querySelector('.name');

            if (todayKey === sDate) {
                if (currentMins >= startTotal && currentMins < endTotal) {
                    tEl.classList.add('time-now'); nEl.classList.add('time-now');
                } else if (currentMins >= endTotal) {
                    tEl.classList.add('time-past'); nEl.classList.add('time-past');
                }
            } else if (parseInt(todayKey) > parseInt(sDate)) {
                tEl.classList.add('time-past'); nEl.classList.add('time-past');
            }
        });
    }

    setInterval(updateLogic, 10000);
    window.onload = updateLogic;
</script>
